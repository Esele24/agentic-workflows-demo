# Render blueprint for the enquiry autoresponder.
#
# Create the service from this file: Render dashboard, New, Blueprint, pick the
# agentic-workflows-demo repo. Render reads this and provisions the service, then
# asks for the values marked sync: false below.
#
# ⚠️ NO SECRET IS IN THIS FILE AND NONE MAY EVER BE. Everything sensitive is
# `sync: false`, which means Render prompts for it once and stores it encrypted.
# This repo is PUBLIC. An SMTP app password committed here is a password
# published to the internet, and rotating it means every client's mail stops
# until it is replaced.

services:
  - type: web
    name: enquiry-autoresponder
    runtime: python
    plan: free
    region: frankfurt          # closest of Render's free regions to Nigeria
    buildCommand: pip install -r requirements.txt

    # ⚠️ ONE WORKER, DELIBERATELY. The rate limiter holds its timestamps in
    # process memory, so every extra worker gets its own private allowance and
    # the real ceiling silently multiplies by the worker count. Two workers means
    # double the mail a stranger can send through the Gmail account.
    #
    # ⚠️ `--bind 0.0.0.0:$PORT` is not decoration. Binding to 127.0.0.1 makes the
    # process reachable only from inside its own container, the health check
    # never connects, and Render marks the deploy failed with no application
    # error to explain it.
    startCommand: gunicorn enquiry_server:app --bind 0.0.0.0:$PORT --workers 1 --timeout 60

    # Hit after every deploy. It answers with the config it can see, which is how
    # you catch a missing variable before a customer does.
    healthCheckPath: /health

    envVars:
      # Prompted at create time. Never stored in git.
      #
      # 🔴 SMTP_USER AND SMTP_PASSWORD ARE GONE ON PURPOSE. Render blocked
      # outbound ports 25, 465 and 587 on FREE web services in September 2025,
      # so the SMTP transport cannot work here: it does not error, it HANGS
      # until gunicorn kills the worker, while /health goes on reporting a
      # perfectly healthy service. Sending a Gmail App Password to a host that
      # is physically unable to use it is exposure with no upside.
      - key: BREVO_API_KEY          # Brevo, SMTP & API, API Keys. Starts xkeysib-
        sync: false
      - key: BREVO_SENDER_EMAIL     # an address VERIFIED in the Brevo dashboard
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: FROM_NAME
        sync: false
      - key: BUSINESS_NAME
        sync: false

      # Safe to commit: not secret, and the defaults matter.
      #
      # Pinned rather than left to send_email.py's automatic choice. The auto
      # rule picks Brevo whenever a key is present, but being explicit here
      # means a missing key fails loudly instead of silently falling back to a
      # transport that hangs on this host.
      - key: EMAIL_TRANSPORT
        value: brevo
      - key: REPLY_WINDOW
        value: within 24 hours
      - key: EPHEMERAL_STORAGE
        value: "true"
      - key: RATE_LIMIT_PER_IP_HOUR
        value: "5"
      - key: RATE_LIMIT_GLOBAL_HOUR
        value: "50"
      # Narrow this to the client's real domain as soon as a site points here.
      # "*" is only acceptable while nothing but curl is calling it.
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PYTHON_VERSION
        value: "3.13.1"
